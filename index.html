<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf5ed"><title>냥냥 브릭 · 작은 행복을 톡!</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./">ฅ 냥냥 아케이드</a><button id="sound" aria-label="효과음 켜기">소리 OFF</button></header><section class="intro"><span class="tag">A LITTLE BREAK, A LITTLE JOY</span><h1>냥냥 브릭<span>작은 행복을 톡!</span></h1><p>말랑한 고양이와 함께, 오늘의 스트레스를 깨뜨려요.</p></section><section class="machine" aria-label="벽돌깨기 게임"><div class="stats"><div>점수 <strong id="score">0000</strong></div><div>STAGE <strong id="stage">01 / 05</strong></div><div><span class="sr">남은 목숨</span><strong id="lives">♥ ♥ ♥</strong></div></div><div class="board"><canvas id="game" width="720" height="540" tabindex="0" aria-label="게임 화면. 방향키로 이동, 스페이스로 발사, P로 일시정지"></canvas><div class="overlay" id="overlay"><div class="cat">ฅ^•ﻌ•^ฅ</div><h2 id="message">오늘도 잘할 수 있냥!</h2><p id="hint">고양이 발판으로 공을 튕겨<br>알록달록 젤리 벽돌을 모두 깨주세요.</p><button class="primary" id="start">시작하기 <span>→</span></button></div></div><div class="toolbar"><span id="status" role="status" aria-live="polite">마음 편히, 천천히 시작해요.</span><div><button id="pause" aria-label="일시정지">Ⅱ</button><button id="restart" aria-label="처음부터 다시 시작">↻</button></div></div></section><div class="instructions"><span><b>↔</b> 마우스 · 방향키 · 터치로 이동</span><span><b>SPACE</b> 공 발사</span><span><b>P</b> 잠깐 쉬기</span></div><footer>BEST <strong id="best">0</strong><span>한 판의 여유, 한 줌의 행복 ♡</span></footer></main><script src="game.js"></script></body></html>
